name: Deploy to Firebase Hosting

# main に push されたら、サイト boxblox-keke-dev (firebase.json の "site") だけを本番公開する
on:
  push:
    branches:
      - main

permissions:
  checks: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency (index.html and version.json)
        run: |
          app=$(grep -oP "window.APP_VERSION = '\K[^']+" index.html)
          json=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "index.html=$app version.json=$json"
          test -n "$app" && test "$app" = "$json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: keke-dev
          channelId: live
